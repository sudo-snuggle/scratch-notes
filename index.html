<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/outline.css">
    <link rel="stylesheet" href="css/editor.css">
    <link rel="stylesheet" href="css/flashcard.css">
</head>
<body>
    <div id="app">
        <aside id="sidebar">
            <div class="sidebar-header">
                <div class="avatar">S</div>
                <div class="account-name">Scratch</div>
            </div>
            <button id="flashcardsBtn" class="sidebar-btn">Flashcards</button>
            <nav id="sidebar-tree"></nav>
            <div class="sidebar-footer">
                <button id="addFolderBtn" title="New folder">📁</button>
                <button id="addPageBtn" title="New page">📄</button>
            </div>
        </aside>
        <main id="main">
            <h1 id="page-title"></h1>
            <ul id="outline"></ul>
            <div id="hint">
                <kbd>Enter</kbd> new line ·
                <kbd>Tab</kbd> indent ·
                <kbd>Shift</kbd>+<kbd>Tab</kbd> outdent ·
                type <kbd>==</kbd> to make a flashcard
            </div>
        </main>
    </div>

    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
    <script src="js/db.js"></script>
    <script src="js/state.js"></script>
    <script src="js/parsing.js"></script>
    <script src="js/notes.js"></script>
    <script src="js/pages.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/caret.js"></script>
    <script src="js/flash-menu.js"></script>
    <script src="js/editor.js"></script>
    <script src="js/editor-events.js"></script>
    <script src="js/outline.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
